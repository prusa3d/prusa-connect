<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prusa Connect</title>
    <!-- What a browser needs to install the app: a phone or a handheld
         scanner then opens it full screen, with its own icon. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#fa6831" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Prusa Connect" />
    <!-- The interface is set in Inter. src/styles/global.css declares the face
         that carries every weight of it, and that rule is the only thing that
         asks for the file. There is no font preload here: this document holds
         no text, so the file is wanted once the application has drawn a
         screen, and a browser reports a preload it has not matched by then as
         unused. `font-display: swap` paints the page in the fallback face
         until the file arrives, which on a local network is the same second. -->
  </head>
  <body>
    <!-- The module theme is linked here, before anything is drawn, so the
         first paint is already in it. A link the parser writes holds the
         paint until it has loaded, and one placed in the body comes after
         every stylesheet in the head, so the theme's rules win at the same
         specificity. The pick and its format are the module-theme store's in
         @prusa/connect-ui; with no pick the page links the server's default,
         which is an empty stylesheet where the server names none. -->
    <script>
      (function () {
        var attribute = 'data-module-theme-default';
        var href = '/api/v1/themes/default.css';
        try {
          var pick = JSON.parse(
            localStorage.getItem('module-theme') || 'false',
          );
          if (pick && pick.key === null) {
            href = '';
          } else if (
            pick &&
            typeof pick.key === 'string' &&
            typeof pick.href === 'string' &&
            pick.href.indexOf('/api/v1/modules/') === 0
          ) {
            attribute = 'data-module-theme';
            href = pick.href;
          }
        } catch (ignored) {
          // A browser that keeps nothing follows the default.
        }
        if (href !== '') {
          var escaped = href.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
          document.write(
            '<link rel="stylesheet" ' + attribute + ' href="' + escaped + '">',
          );
        }
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
