# This package alone. Every JavaScript package in this tree is its own pnpm
# project.
packages:
  - .

# Dependencies must have been public for 3 days before pnpm resolves them,
# the same window the other JavaScript packages in this tree set.
minimumReleaseAge: 4320

# Written versions stay exact.
savePrefix: ''

# No dependency here needs a build script, so none is allowed one. pnpm 11
# refuses every dependency script that allowBuilds does not name. Playwright's
# install script only prints a hint; the browser comes from
# `pnpm exec playwright install chromium`.
allowBuilds: {}

# Refuse to run a script when node_modules has drifted from the lockfile,
# instead of failing later with a confusing error.
verifyDepsBeforeRun: error

# package.json names the three packages by version, the way it will once they
# are on npm. Here they come from this tree: the SDK and the library linked,
# standards copied, because linked its ESLint config would load eslint from
# packages/standards instead of from here.
overrides:
  # minimatch 10 has GHSA-g3hv-75wg-m249 and no fixed 10.x. ESLint calls only
  # minimatch() and new Minimatch(), which 11 keeps.
  'minimatch@10': '11.0.8'
  '@prusa/connect': 'link:../../../packages/typescript'
  '@prusa/connect-ui': 'link:../../../packages/svelte'
  '@prusa/frontend-standards': 'file:../../../packages/standards'

# The peers are dev dependencies here already. Left on, pnpm would also try to
# fetch @prusa/connect from the public registry, where nothing publishes
# it before the release workflow does.
autoInstallPeers: false
