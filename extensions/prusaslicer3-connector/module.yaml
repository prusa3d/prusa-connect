# The one manifest for both halves of this module: the Go process in main.go
# and the browser bundle under ui/.
#
# This file names no namespace. The host derives the namespace from the module
# path the operator installed.

name: prusaslicer3-connector
title: PrusaSlicer 3 Connector
summary: Lets PrusaSlicer 3 in offline mode sign in to this server, list its printers and send a print, as it does with Prusa Connect.
codeowner: Prusa Research
kind: sink
version: 0.1.1
license: OCL v1.1 + Micro v1 + NoSaaS v1 + SWAtt v1
contract_major: 1
openapi: openapi.json

# The wire methods the module calls: the printers and the print as the person
# who asks, whether that person may operate the printer, and the names of the
# people for the me reply (ADR-20261112-2eb). The slicer gets its credential
# from the core's app pairing, not from the module (ADR-20261112-nay).
#
# The module needs routes.staged and its grants, the access_token of a
# collected app pairing, and a print that keeps both files and deletes its
# source. No core before 0.1.0-beta.2 does all of these.
require:
  core: ">=0.1.0-beta.2"
  core-device.list: "*"
  core-device.get: "*"
  core-device.print: "*"
  core-access.people: "*"
  core-access.check: "*"

# The name a person signed in under, for the me reply.
list_people: true

# Ask whether the person who sends a print may operate the printer, so a
# person who may only view it is refused before the slicer sends the file. It
# grants the module no action of its own.
checks:
  - operate

# A folder for the staged uploads and the print folder the host prints from.
needs:
  data: true
  memory_mib: 64

routes:
  # The person's avatar: a square in one colour with their initials. PrusaSlicer
  # downloads the avatar_small of the me reply with no credential. The query
  # alone decides the picture, and the route reads nothing the host holds.
  public:
    - method: GET
      path: /account/api/v1/me/avatar.png
  # The G-code. The host writes it into staged/ of the data folder. The
  # operator approves the limit at install and may change it later, and the
  # module takes the limit it was granted as the largest file.
  staged:
    - method: PUT
      path: /connect/app/teams/{team}/files/raw
      max_mib: 1024

platforms:
  - linux_amd64
  - linux_arm64
  - darwin_amd64
  - darwin_arm64
  - windows_amd64

ui:
  entry: ui/index.js
  library: ">=0.0.1 <1.0.0"
  contributes:
    pages:
      - path: select-printer
        title: Print from PrusaSlicer
        icon: printer
        hidden: true
    # "Set as current" on a printer, as Prusa Connect shows it inside
    # PrusaSlicer: under the printer page's header, and on every printer of
    # the listing. The bundle registers both only when PrusaSlicer shows the
    # page, so a browser draws neither (ADR-20261112-62y).
    device_header:
      - id: set-as-current
        title: Set as current in PrusaSlicer
    device_row:
      - id: set-as-current
        title: Set as current in PrusaSlicer
