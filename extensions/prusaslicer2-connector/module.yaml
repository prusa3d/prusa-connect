# The one manifest for both halves of this module: the Go process in main.go
# and the browser bundle under ui/.
#
# This file names no namespace. The host derives the namespace from the module
# path the operator installed.

name: prusaslicer2-connector
title: PrusaSlicer 2 Connector
summary: Lets PrusaSlicer 2.4 and later send a print to each printer of this server as it sends one to a printer with PrusaLink.
codeowner: Prusa Research
kind: sink
version: 0.1.2
license: OCL v1.1 + Micro v1 + NoSaaS v1 + SWAtt v1
contract_major: 1
openapi: openapi.json

# The wire methods the module calls: the printer, the print and the send of a
# file that only lands, as the person who sends the file, and whether that
# person may operate the printer. A printer whose Save to storage is on has
# each upload written into a storage of this server first, as that person,
# under a name no file there holds yet.
#
# The slicer signs in with an API credential in the X-Api-Key header and the
# module receives Print-After-Upload, which no core before 0.1.0-beta.2 does.
# It lands a file with device.send, which core-device.send asks of the core.
# A build from a commit reports 0.1.0+<commit>, which the range holds.
require:
  core: ">=0.1.0-beta.2"
  core-device.get: "*"
  core-device.print: "*"
  core-device.send: "*"
  core-access.check: "*"
  core-storage.stat: "*"
  core-storage.write: "*"

# Ask whether the person who sends a print may operate the printer, so a
# person who may only view it is refused before the printer is asked. It grants
# the module no action of its own.
checks:
  - operate

# A folder for the staged uploads and the print folder the host prints from.
needs:
  data: true
  memory_mib: 64

routes:
  # The G-code. The host writes it into staged/ of the data folder. The
  # operator approves the limit at install and may change it later. PrusaSlicer
  # 2.6 and later sends the file with PUT, and older releases with POST in a
  # form.
  staged:
    - method: PUT
      path: /printers/{printer}/api/v1/files/{storage}/{name}
      max_mib: 1024
      title: Upload from PrusaSlicer 2.6 and later
    - method: POST
      path: /printers/{printer}/api/files/{storage}
      max_mib: 1024
      title: Upload from PrusaSlicer 2.5 and older
  # The one header the module reads beyond the usual ones. PrusaSlicer says
  # with it whether the printer starts the file. Without it every Upload and
  # Print would only keep the file and still answer success, so the module
  # does not start without it.
  headers:
    - name: Print-After-Upload
      reason: PrusaSlicer says with it whether to start the print after the upload, or only to put the file on the printer
      required: true

platforms:
  - linux_amd64
  - linux_arm64
  - darwin_amd64
  - darwin_arm64
  - windows_amd64

ui:
  entry: ui/index.js
  library: ">=0.0.1 <1.0.0"
  contributes:
    # The address and the API credential a person types into PrusaSlicer for
    # one printer, and whether its uploads are also saved on this server, at
    # the printer's Printer tab, under its Connection card.
    device_info_section:
      - id: prusalink
        title: PrusaSlicer 2 Connector
