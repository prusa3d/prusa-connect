# The manifest for a module that is one browser bundle and nothing else. There
# is no process here, so there is no contract_major, no permissions block and
# no OpenAPI fragment.
#
# `prusa-connect module add` reads it out of the release, writes one
# declaration, and copies it into the bundle directory it installs, because
# that is where the host reads the ui block from. The digest covers it there,
# so the manifest the host reads is the one the install recorded.
#
# The namespace is absent on purpose. The host derives it from the repository
# address the operator installed, so no module can name another module's
# address. For this module that is com.github.aux.prusa3d.fleet-stats.

name: fleet-stats
# The one kind this module is declared under: a directory of files the host
# verifies against a digest and serves, and never runs.
kind: asset
version: 0.3.4
license: OCL v1.1 + Micro v1 + NoSaaS v1 + SWAtt v1
# The core the bundle is built for. It reads the prints the core keeps, with
# how each one ended and narrowed by when it ended, which 0.0.1-alpha.8 is the
# first core to answer. A catalogue offers the release to no older core.
require:
  core: ">=0.0.1-alpha.8"
# What a marketplace card prints beside the name: one sentence about this
# module, and who answers for it. The install copies both into the declaration,
# so `GET /api/v1/resources` carries them for an installed module.
title: Fleet stats
summary: Job KPIs, a daily trend, the most printed files, a utilization heatmap and failures for the fleet, with dashboard cards.
codeowner: Prusa Research

ui:
  # The built bundle's entry, relative to the bundle root. The host serves it
  # at /api/v1/modules/com.github.aux.prusa3d.fleet-stats/ui/ui/index.js.
  entry: ui/index.js
  # The range of @prusa/connect-ui this bundle was built against. The app
  # refuses a bundle its own version falls outside of.
  library: ">=0.0.1 <1.0.0"
  contributes:
    # The whole of what this bundle may register. A registration the block
    # does not declare is refused at run time and the app drops this module.
    # Every entry here has one `host.register` call behind it in
    # ui/src/index.ts, and the generator wrote the pair from one answer.
    pages:
      - path: fleet-stats
        title: Statistics
        icon: chart-line
    device_card:
      - id: fleet-stats
        title: Success rate
    device_section:
      - id: fleet-stats
        title: Print statistics
    # The cards a person can put on a dashboard. Each counts a period and the
    # printers a person picks, the whole fleet when they pick none, and links
    # to the page showing the same.
    cards:
      - id: kpis
        title: Fleet figures
        description: Jobs, success, print hours and utilization, against the period before.
        icon: chart-line
        size: {w: 6, h: 3}
        least: {w: 3, h: 3}
        settings:
          - key: period
            kind: choice
            label: Period
            options:
              - {value: "7", label: 7 days}
              - {value: "30", label: 30 days}
              - {value: "90", label: 90 days}
            default: "7"
          - key: printers
            kind: printers
            label: Printers
          - key: tag
            kind: tag
            label: Tag
      - id: trend
        title: Daily trend
        description: Jobs, success or print hours day by day.
        icon: chart-line
        size: {w: 6, h: 5}
        least: {w: 4, h: 4}
        settings:
          - key: period
            kind: choice
            label: Period
            options:
              - {value: "7", label: 7 days}
              - {value: "30", label: 30 days}
              - {value: "90", label: 90 days}
            default: "30"
          - key: printers
            kind: printers
            label: Printers
          - key: tag
            kind: tag
            label: Tag
          - key: metric
            kind: choice
            label: Metric
            options:
              - {value: jobs, label: Jobs}
              - {value: success, label: Success}
              - {value: hours, label: Print hours}
            default: jobs
      - id: utilization
        title: Utilization heatmap
        description: When each printer prints, hour by weekday.
        icon: calendar-clock
        size: {w: 6, h: 4}
        least: {w: 4, h: 4}
        settings:
          - key: period
            kind: choice
            label: Period
            options:
              - {value: "7", label: 7 days}
              - {value: "30", label: 30 days}
              - {value: "90", label: 90 days}
            default: "7"
          - key: printers
            kind: printers
            label: Printers
          - key: tag
            kind: tag
            label: Tag
      - id: failures
        title: Recent failures
        description: The newest failed and cancelled jobs, with their printers.
        icon: list-checks
        size: {w: 4, h: 5}
        least: {w: 3, h: 3}
        settings:
          - key: period
            kind: choice
            label: Period
            options:
              - {value: "7", label: 7 days}
              - {value: "30", label: 30 days}
              - {value: "90", label: 90 days}
            default: "7"
          - key: printers
            kind: printers
            label: Printers
          - key: tag
            kind: tag
            label: Tag
          - key: limit
            kind: number
            label: How many
            min: 1
            max: 20
            step: 1
            default: 5
